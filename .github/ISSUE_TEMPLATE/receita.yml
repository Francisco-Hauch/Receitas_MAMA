name: Nova receita
description: Enviar uma receita por foto, áudio, link ou texto
title: "[receita] "
labels: ["receita", "status:novo"]
body:
  - type: markdown
    attributes:
      value: |
        Fica na fila até o PC ligar — não precisa esperar nada.

        **Foto tem um passo a mais.** Anexo de issue em repositório privado
        não pode ser lido por fora do navegador, então a imagem precisa entrar
        no repositório: vá em `data/fotos/` → **Add file** → **Upload files**,
        envie a foto, e depois escreva aqui **só o nome do arquivo**
        (um por linha, se a receita ocupar mais de uma foto).

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de entrada
      options:
        - foto
        - audio
        - link
        - texto
    validations:
      required: true

  - type: textarea
    id: conteudo
    attributes:
      label: Conteúdo
      description: >
        Foto: o NOME do arquivo que você subiu em data/fotos/, um por linha.
        Link: cole a URL. Texto: digite a receita direto.
      placeholder: |
        pao-de-alho-frente.jpg
        pao-de-alho-verso.jpg
    validations:
      required: true

  - type: input
    id: titulo
    attributes:
      label: Nome da receita
      description: Se você já souber. Senão deixo o Claude sugerir.
      placeholder: Bolo de fubá da vovó

  - type: textarea
    id: notas
    attributes:
      label: Observações
      description: Qualquer coisa que ajude na hora de interpretar.
      placeholder: |
        A vó usava banha no lugar do óleo.
        A letra do "fermento" está ilegível, era 1 colher mesmo.
